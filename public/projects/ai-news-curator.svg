<svg viewBox="0 0 1600 1000" width="1600" height="1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI News Curator — keyless on-device RAG over today's economy news">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1117"/>
      <stop offset="1" stop-color="#171b26"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg2)"/>

  <!-- header -->
  <text x="90" y="132" font-family="'Segoe UI', system-ui, sans-serif" font-size="76" font-weight="700" fill="#f1f5f9">AI News <tspan fill="url(#violet)">Curator</tspan></text>
  <text x="90" y="188" font-family="'Segoe UI', system-ui, sans-serif" font-size="32" fill="#8b95a8">Today's economy news, grounded answers — embeddings and the LLM both run in your browser</text>

  <!-- chips -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="26" fill="#a78bfa">
    <rect x="90" y="224" width="184" height="50" rx="25" fill="#1c2130" stroke="#343d54"/>
    <text x="182" y="256" text-anchor="middle">no API key</text>
    <rect x="292" y="224" width="196" height="50" rx="25" fill="#1c2130" stroke="#343d54"/>
    <text x="390" y="256" text-anchor="middle">WebGPU LLM</text>
    <rect x="506" y="224" width="164" height="50" rx="25" fill="#1c2130" stroke="#343d54"/>
    <text x="588" y="256" text-anchor="middle">24h only</text>
    <rect x="688" y="224" width="278" height="50" rx="25" fill="#1c2130" stroke="#343d54"/>
    <text x="827" y="256" text-anchor="middle">no politics / sports</text>
  </g>

  <!-- ask box -->
  <rect x="90" y="318" width="1420" height="96" rx="16" fill="#141824" stroke="#39415a" stroke-width="2"/>
  <text x="128" y="378" font-family="'Segoe UI', system-ui, sans-serif" font-size="32" fill="#64748b">Ask the news</text>
  <text x="330" y="378" font-family="'Segoe UI', system-ui, sans-serif" font-size="32" fill="#e2e8f0">원화 약세가 오늘 수출주에 어떤 영향을 줬어?</text>
  <rect x="1330" y="338" width="150" height="56" rx="12" fill="#a78bfa"/>
  <text x="1405" y="376" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="600" fill="#0f1117">Ask</text>

  <!-- grounded answer -->
  <rect x="90" y="446" width="1420" height="212" rx="16" fill="#12161f" stroke="#2a3245" stroke-width="2"/>
  <text x="128" y="500" font-family="'Segoe UI', system-ui, sans-serif" font-size="30" fill="#cbd5e1">환율 상승으로 수출 비중이 높은 반도체·자동차 종목이 강세를 보였고,</text>
  <text x="128" y="546" font-family="'Segoe UI', system-ui, sans-serif" font-size="30" fill="#cbd5e1">원자재 수입 의존 업종은 원가 부담이 커졌습니다 <tspan fill="#38bdf8">[1]</tspan><tspan fill="#38bdf8">[3]</tspan>.</text>
  <text x="128" y="612" font-family="Consolas, Menlo, monospace" font-size="25" fill="#5b6678">retrieved 5 of 214 articles · on-device E5 embeddings · 0 requests to a server</text>

  <!-- article feed -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="90" y="694" width="452" height="184" rx="14" fill="#161b28" stroke="#2a3245"/>
    <text x="120" y="742" font-size="24" fill="#38bdf8">[1] 경제</text>
    <text x="120" y="790" font-size="27" fill="#dbe3ee">원/달러 환율 장중 1,490원대</text>
    <text x="120" y="834" font-size="23" fill="#64748b">2시간 전 · 한국경제</text>

    <rect x="574" y="694" width="452" height="184" rx="14" fill="#161b28" stroke="#2a3245"/>
    <text x="604" y="742" font-size="24" fill="#38bdf8">[2] Business</text>
    <text x="604" y="790" font-size="27" fill="#dbe3ee">Chipmakers rally on won weakness</text>
    <text x="604" y="834" font-size="23" fill="#64748b">5h ago · Reuters</text>

    <rect x="1058" y="694" width="452" height="184" rx="14" fill="#161b28" stroke="#2a3245"/>
    <text x="1088" y="742" font-size="24" fill="#38bdf8">[3] 경제</text>
    <text x="1088" y="790" font-size="27" fill="#dbe3ee">수입 원자재 가격 부담 확대</text>
    <text x="1088" y="834" font-size="23" fill="#64748b">8시간 전 · 매일경제</text>
  </g>

  <!-- footer -->
  <text x="90" y="946" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" fill="#4b5566">hakhyun-kim.github.io/AINewsCurator</text>
</svg>
